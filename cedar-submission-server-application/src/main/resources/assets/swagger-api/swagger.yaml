openapi: 3.0.1
info:
  description: |
    Better Metadata - Better Science

    The submission server takes CEDAR metadata to the repositories that expect it in their own
    shape: NCBI BioSample and AIRR, ImmPort, and LINCS.

    Two things happen here. Validation converts a CEDAR instance into the target format and returns
    that repository's own verdict on it, sending nothing. Submission receives a package of files a
    chunk at a time, assembles it, and forwards it once the last chunk lands — so a successful
    response means the chunk was stored and any submission it completed was started, not that the
    repository has accepted anything.
  title: CEDAR Submission Server API
  version: 2.9.10-SNAPSHOT
paths:
  /:
    get:
      operationId: showInfo
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The service name and links to its API documentation
      summary: Describe this CEDAR service
      tags:
      - Service
  /command/immport-submit:
    post:
      description: "Receive the files of an ImmPort submission, assemble them in CEDAR,\
        \ and once they are all present submit them to the named workspace. The package\
        \ arrives a chunk at a time, so a caller sends this repeatedly; the submission\
        \ starts by itself once the last chunk lands. A 200 therefore means the chunk\
        \ was stored and any submission it completed was started, not that the repository\
        \ has accepted anything. While the package is still arriving the response\
        \ is an empty object rather than a submission result."
      operationId: submitImmPort
      responses:
        "200":
          description: "The chunk was stored; ImmPort's result if this completed the\
            \ submission, an empty object if not"
        "400":
          description: "Not a multipart upload, or no workspace was named"
        "401":
          description: Unauthorized
        "500":
          description: "ImmPort could not be reached, or no ImmPort token is configured"
      security:
      - api_key: []
      summary: Upload a submission package and send it to ImmPort
      tags:
      - ImmPort
  /command/immport-submit-old:
    post:
      description: "The earlier ImmPort path, taking the whole submission as a single\
        \ multipart request rather than in chunks. Kept for testing from the command\
        \ line; the chunked route is what the workbench uses."
      operationId: submitImmPortOld
      responses:
        "200":
          description: ImmPort's submission result
        "400":
          description: "Not a multipart upload, or no workspaceId parameter"
        "401":
          description: Unauthorized
        "500":
          description: "ImmPort could not be reached, or no ImmPort token is configured"
      security:
      - api_key: []
      summary: Send a submission to ImmPort in one request
      tags:
      - ImmPort
  /command/immport-workspaces:
    get:
      description: "Ask ImmPort which workspaces the configured account can submit\
        \ to, and return them. A submission names one of these."
      operationId: immPortWorkspaces
      responses:
        "200":
          description: The available ImmPort workspaces
        "401":
          description: Unauthorized
        "500":
          description: "ImmPort could not be reached, or no ImmPort token is configured"
      security:
      - api_key: []
      summary: List the caller's ImmPort workspaces
      tags:
      - ImmPort
  /command/upload-cairr-to-cedar:
    post:
      description: "Receive the files of an AIRR submission, assemble them in CEDAR,\
        \ and once they are all present send them to NCBI over FTP. The package arrives\
        \ a chunk at a time, so a caller sends this repeatedly; the submission starts\
        \ by itself once the last chunk lands. A 200 therefore means the chunk was\
        \ stored and any submission it completed was started, not that the repository\
        \ has accepted anything. A package must carry exactly one metadata file. Submissions\
        \ are sent one at a time, through a queue."
      operationId: uploadCAIRRToCEDAR
      responses:
        "200":
          description: The chunk was stored; any submission it completed has been
            started
        "400":
          description: "Not a multipart upload, or the package does not carry exactly\
            \ one metadata file"
        "401":
          description: Unauthorized
        "500":
          description: The chunk could not be stored or the submission could not be
            prepared
      security:
      - api_key: []
      summary: Upload an AIRR submission package and send it to NCBI
      tags:
      - NCBI AIRR
  /command/upload-ncbi-to-cedar:
    post:
      description: "Receive the files of a BioSample submission, assemble them in\
        \ CEDAR, and once they are all present send them to NCBI over FTP. The package\
        \ arrives a chunk at a time, so a caller sends this repeatedly; the submission\
        \ starts by itself once the last chunk lands. A 200 therefore means the chunk\
        \ was stored and any submission it completed was started, not that the repository\
        \ has accepted anything. A package must carry exactly one metadata file. Submissions\
        \ are sent one at a time, through a queue."
      operationId: uploadNCBIToCEDAR
      responses:
        "200":
          description: The chunk was stored; any submission it completed has been
            started
        "400":
          description: "Not a multipart upload, or the package does not carry exactly\
            \ one metadata file"
        "401":
          description: Unauthorized
        "500":
          description: The chunk could not be stored or the submission could not be
            prepared
      security:
      - api_key: []
      summary: Upload a BioSample submission package and send it to NCBI
      tags:
      - NCBI BioSample
  /command/validate-biosample:
    post:
      description: "Convert a CEDAR instance of the AMIA 2016 demo BioSample template\
        \ into NCBI's BioSample submission XML and validate that, returning the validator's\
        \ report. Kept for the template that demo used; new work validates against\
        \ the generic NCBI route. A controlled term where the template expects a literal\
        \ is tolerated rather than rejected, since instances in the wild carry them."
      operationId: validateBioSample
      responses:
        "200":
          description: The BioSample validation report
        "401":
          description: Unauthorized
        "500":
          description: The instance could not be converted to BioSample XML
      security:
      - api_key: []
      summary: Validate an AMIA 2016 demo BioSample instance
      tags:
      - NCBI BioSample
  /command/validate-cairr:
    post:
      description: "Convert a CEDAR AIRR instance into the NCBI submission XML and\
        \ validate it, returning the report. Validation only: nothing is sent to NCBI\
        \ here."
      operationId: validateCairr
      responses:
        "200":
          description: The validation report
        "400":
          description: The instance could not be read as an AIRR submission
        "401":
          description: Unauthorized
        "500":
          description: The submission XML could not be generated
      security:
      - api_key: []
      summary: Validate an AIRR instance for NCBI
      tags:
      - NCBI AIRR
  /command/validate-lincs:
    post:
      description: "Forward a CEDAR instance to the LINCS dataset validator and return\
        \ what it says. The status is the validator's own, so its refusal is reported\
        \ as it reported it, and CEDAR adds no judgement of its own."
      operationId: validateInstance
      responses:
        "200":
          description: The LINCS validation report
        "400":
          description: The LINCS validator rejected the instance
        "401":
          description: Unauthorized
        "500":
          description: The LINCS validator could not be reached
      security:
      - api_key: []
      summary: Validate an instance against the LINCS validator
      tags:
      - LINCS
  /command/validate-ncbi:
    post:
      description: "Convert a CEDAR instance into the NCBI BioSample submission XML\
        \ and validate it, returning the report. Validation only: nothing is sent\
        \ to NCBI here. This is the generic route, which works from the instance's\
        \ own template rather than a fixed one."
      operationId: validateNcbi
      responses:
        "200":
          description: The validation report
        "400":
          description: The instance could not be read as a BioSample submission
        "401":
          description: Unauthorized
        "500":
          description: The submission XML could not be generated
      security:
      - api_key: []
      summary: Validate an instance for NCBI BioSample
      tags:
      - NCBI BioSample
  /healthcheck:
    get:
      operationId: healthCheck
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Every health check passed
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                type: object
          description: At least one health check failed
      security:
      - api_key: []
      summary: Run this service's health checks
      tags:
      - Service diagnostics
  /insight/full:
    get:
      operationId: full
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report all JVM diagnostics except per-thread stack traces
      tags:
      - Service diagnostics
  /insight/gc:
    get:
      operationId: gc
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report JVM garbage-collection counts
      tags:
      - Service diagnostics
  /insight/memory:
    get:
      operationId: memory
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report JVM memory use
      tags:
      - Service diagnostics
  /insight/system:
    get:
      operationId: system
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report operating-system information
      tags:
      - Service diagnostics
  /insight/thread-details:
    get:
      operationId: threadDetails
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report details and stack traces for every JVM thread
      tags:
      - Service diagnostics
  /insight/threads:
    get:
      operationId: threads
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The requested JVM diagnostic report
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
      security:
      - api_key: []
      summary: Report JVM thread counts
      tags:
      - Service diagnostics
components:
  schemas:
    CedarError:
      type: object
      additionalProperties: true
      description: A CEDAR error response. Diagnostic fields are populated only when
        they are relevant to the failure.
      properties:
        entities:
          type: object
          additionalProperties:
            type: object
            description: Named domain entities associated with exception-mapped errors.
            nullable: true
          description: Named domain entities associated with exception-mapped errors.
          nullable: true
        errorId:
          type: string
          format: uuid
          description: Correlation identifier for an internal error recorded in server
            logs.
          nullable: true
        errorKey:
          type: string
          description: Stable machine-readable error identifier.
          enum:
          - templateElementNotCreated
          - templateElementNotFound
          - templateElementNotDeleted
          - templateElementNotUpdated
          - templateElementsNotListed
          - templateFieldNotCreated
          - templateFieldNotFound
          - templateFieldNotDeleted
          - templateFieldNotUpdated
          - templateFieldsNotListed
          - templateNotCreated
          - templateNotFound
          - templateNotDeleted
          - templateNotUpdated
          - templatesNotListed
          - templateInstanceNotCreated
          - templateInstanceNotFound
          - templateInstanceNotDeleted
          - templateInstanceNotUpdated
          - templateInstancesNotListed
          - noReadAccessToResource
          - noWriteAccessToResource
          - noReadAccessToFolder
          - noWriteAccessToFolder
          - noReadAccessToTemplate
          - noWriteAccessToTemplate
          - noReadAccessToTemplateElement
          - noWriteAccessToTemplateElement
          - noReadAccessToTemplateField
          - noWriteAccessToTemplateField
          - noReadAccessToTemplateInstance
          - noWriteAccessToTemplateInstance
          - noReadAccessToArtifact
          - noWriteAccessToArtifact
          - noReadAccessToCategory
          - noWriteAccessToCategory
          - folderNotFound
          - artifactNotFound
          - artifactPreconditionRequired
          - artifactHasMovedOn
          - verbatimWriteRefused
          - nodeNotFound
          - unknownResourceType
          - missingParameter
          - invalidInput
          - sourceFolderNotFound
          - sourceResourceNotFound
          - targetFolderNotFound
          - nodeNotMoved
          - groupNotFound
          - userNotFound
          - uniqueConstraintCollision
          - invalidData
          - notAuthorized
          - permissionMissing
          - tokenInvalid
          - userInfoLoadByTokenFailed
          - userInfoLoadByApiKeyFailed
          - cedarUserNotFound
          - authorizationNotFound
          - permissionNotOwned
          - authorizationTypeUnknown
          - apiKeyNotFound
          - tokenMissing
          - tokenExpired
          - parentFolderNotSpecified
          - parentFolderSpecifiedTwice
          - pathNotNormalized
          - parentFolderNotFound
          - updateInvalidFolderName
          - createInvalidFolderName
          - nodeAlreadyPresent
          - folderNotCreated
          - missingNameAndDescription
          - missingData
          - folderNotDeleted
          - artifactNotDeleted
          - resourceNotCreated
          - invalidResourceType
          - invalidArtifactType
          - readOtherProfileForbidden
          - updateOtherProfileForbidden
          - folderCanNotBeDeleted
          - folderCanNotBeChanged
          - groupAlreadyPresent
          - groupCanBeModifiedOnlyByGroupAdmin
          - groupCanBeDeletedOnlyByGroupAdmin
          - groupMembersCanBeReadOnlyByGroupAdmin
          - groupRequiresAdministrator
          - groupUsersNotUpdated
          - specialGroupCanNotBeDeleted
          - folderPermissionsCanNotBeChanged
          - unknownInstanceOutputFormat
          - folderCopyNotAllowed
          - methodNotImplemented
          - upstreamServerError
          - nothingToDo
          - parentCategoryNotFound
          - categoryAlreadyPresent
          - categoryNotFound
          - categoryCanNotBeDeleted
          - rootCategoryCanNotBeDeleted
          - unableToAttachCategory
          - unableToDetachCategory
          - noCategoriesWereAttached
          - malformedJsonRequestBody
          - malformedSearchTerm
          - publishedArtifactCanNotBeChanged
          - publishedArtifactCanNotBeDeleted
          - versioningOnlyOnLatest
          - versioningOnlyByOwner
          - nonVersionedArtifactType
          - createDraftOnlyFromPublished
          - publishOnlyDraft
          - draftNotCreated
          - contentNotValid
          - doiNotSupportedByResourceType
          - doiCanNotBeSetForEmptyAtId
          - doiCanNotBeAltered
          - doiCanNotBeSet
          - doiAlreadyExists
          - dataCiteDOIDisabled
          - resourceNotFound
          - internalError
          nullable: true
        errorMessage:
          type: string
          description: Alias of message retained for compatibility.
          nullable: true
        errorReasonKey:
          type: string
          description: More specific machine-readable reason for the error.
          enum:
          - nonEmptyFolder
          - nonEmptyCategory
          - userHomeFolder
          - systemFolder
          - templateReferencedInInstances
          - validationError
          - continuationExpired
          nullable: true
        errorType:
          type: string
          description: Broad category of the error.
          enum:
          - notFound
          - invalidArgument
          - authorization
          - permission
          - server
          - validationError
          nullable: true
        message:
          type: string
          description: Human-readable error message.
          nullable: true
        objects:
          type: object
          additionalProperties:
            type: object
            description: Named structured values associated with the error.
          description: Named structured values associated with the error.
        operation:
          type: object
          description: Operation that failed. Its fields depend on the operation type.
          nullable: true
        parameters:
          type: object
          additionalProperties:
            type: object
            description: Named scalar values associated with the error.
          description: Named scalar values associated with the error.
        status:
          type: string
          description: Symbolic HTTP response status.
          enum:
          - BAD_REQUEST
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - NOT_ACCEPTABLE
          - CONFLICT
          - PRECONDITION_FAILED
          - UNSUPPORTED_MEDIA_TYPE
          - UNPROCESSABLE_ENTITY
          - PRECONDITION_REQUIRED
          - INTERNAL_SERVER_ERROR
          - NOT_IMPLEMENTED
          - BAD_GATEWAY
          - SERVICE_UNAVAILABLE
          - HTTP_VERSION_NOT_SUPPORTED
        statusCode:
          type: integer
          format: int32
          description: Numeric HTTP response status.
          maximum: 599
          minimum: 400
        suggestedAction:
          type: string
          description: Recovery action suggested to the client.
          enum:
          - none
          - requestRole
          - logout
          - logoutImmediately
          - provideAuthorizationHeader
          - refreshToken
          nullable: true
      required:
      - status
      - statusCode
  securitySchemes:
    api_key:
      description: "Your CEDAR API key, using the format 'apiKey <yourApiKey>'"
      in: header
      name: Authorization
      type: apiKey
